name: Keep Alive 2

on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        url:
          - https://opencode-telegram-bot.onrender.com
          - https://opencode-telegram-bot.onrender.com/ping?source=gha2
    steps:
      - name: Ping with retry
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ matrix.url }}" || echo "000")
            echo "Attempt $i: HTTP $code"
            [ "$code" != "000" ] && break
            sleep 5
          done
